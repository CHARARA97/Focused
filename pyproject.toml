[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "focusd"
#: Kept in step with focused/__init__.py by tests/test_version.py.
version = "0.2.0"
description = "Suspend distracting applications while you focus, and resume them after."
readme = "README.md"
requires-python = ">=3.9"
#: SPDX expression, not a table: setuptools deprecated the table form and removes it
#: by 2027-02.  The licence file itself is declared separately, below.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ChillFocused contributors" }]
keywords = ["focus", "pomodoro", "productivity", "linux", "systemd"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
  "Topic :: Utilities",
]
#: No runtime dependencies: the engine is standard library only, on purpose.  A tool
#: that sends signals to your applications should not drag in a dependency tree.
dependencies = []

[project.urls]
Homepage = "https://github.com/CHARARA97/Focused"
Documentation = "https://github.com/CHARARA97/Focused/blob/main/docs/focused.md"
Issues = "https://github.com/CHARARA97/Focused/issues"

[project.scripts]
focused = "focusedd:main"
focusedd = "focusedd:main"   # compatibility alias

[tool.setuptools]
#: The CLI lives at the project root; all implementation is under focused/.
py-modules = ["focusedd"]

[tool.setuptools.packages.find]
include = ["focused*"]
